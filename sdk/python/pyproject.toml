[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "stixis-captain-sdk"
version = "0.1.0"
description = "Thin typed Python client for the Stixis Captain AI governance gateway"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
license = { text = "UNLICENSED" }

[tool.hatch.build.targets.wheel]
packages = ["src/captain_sdk"]
