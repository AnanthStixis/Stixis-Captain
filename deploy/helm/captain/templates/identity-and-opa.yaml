apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  {{- if .Values.azure.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "azure.workloadIdentityClientId is required" .Values.azure.workloadIdentityClientId | quote }}
    azure.workload.identity/tenant-id: {{ required "azure.tenantId is required" .Values.azure.tenantId | quote }}
  {{- end }}
{{- if .Values.azure.enabled }}
---
# Key Vault -> Kubernetes Secret `existingSecret`, read as the workload identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: captain-secrets
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "azure.keyVaultName is required" .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        {{- range $key, $kv := .Values.azure.secrets }}
        - |
          objectName: {{ $kv }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ .Values.existingSecret }}
      type: Opaque
      data:
        {{- range $key, $kv := .Values.azure.secrets }}
        - { objectName: {{ $kv }}, key: {{ $key }} }
        {{- end }}
{{- end }}
---
# OPA runs only the signed policy bundle (ADR-003): it refuses an unsigned or altered one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: captain-opa
  labels: { app.kubernetes.io/name: opa }
spec:
  replicas: {{ .Values.opa.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: opa }
  template:
    metadata:
      labels: { app.kubernetes.io/name: opa }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10002 }
      containers:
        - name: opa
          image: {{ .Values.opa.image }}
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --bundle
            - /bundle/bundle.tar.gz
            - --verification-key
            - /keys/public.pem
            - --signing-alg
            - RS256
          ports: [{ containerPort: 8181 }]
          readinessProbe: { httpGet: { path: "/health?bundles", port: 8181 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8181 }, periodSeconds: 10 }
          volumeMounts:
            - { name: bundle, mountPath: /bundle, readOnly: true }
            - { name: key, mountPath: /keys, readOnly: true }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: bundle
          configMap: { name: {{ .Values.opa.bundleConfigMap }} }
        - name: key
          configMap: { name: {{ .Values.opa.verificationKeyConfigMap }} }
---
apiVersion: v1
kind: Service
metadata:
  name: captain-opa
spec:
  selector: { app.kubernetes.io/name: opa }
  ports: [{ port: 8181, targetPort: 8181 }]
