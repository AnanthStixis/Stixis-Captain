# Local development infrastructure for Captain Core.
# Captain itself runs from the host venv during Phase 1; it is containerised later.
# Image tags are pinned on purpose (CTO F13: supply-chain control).
name: captain-dev

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: captain
      POSTGRES_USER: captain
      POSTGRES_PASSWORD: ${CAPTAIN_DB_PASSWORD:?set CAPTAIN_DB_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captain -d captain"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.0.2
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  opa:
    image: openpolicyagent/opa:1.0.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info", "/policies"]
    ports: ["8181:8181"]
    volumes: ["../../policies:/policies:ro"]

volumes:
  pgdata:
